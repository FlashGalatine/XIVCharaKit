name: Check the undici override

# pnpm-workspace.yaml pins undici for miniflare because the newest wrangler still resolves a
# vulnerable one (the advisories that make `pnpm audit` fail in CI and in the publish workflow).
# Every Monday this asks the public npm registry whether the newest wrangler no longer needs the pin,
# and opens one issue when the override can be dropped. It changes nothing in the repository.
# Scheduled workflows run from the default branch only.
# The check job installs and runs the repository's dependencies with a read-only token. Only the
# report job may write issues, and it neither checks out nor installs anything: it reads the check's
# output from an artifact and keeps that text in a file, never in a run block or an expression.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: undici-override
  cancel-in-progress: false

jobs:
  check:
    name: Can the miniflare>undici override be dropped?
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      status: ${{ steps.check.outputs.status }}
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.27.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Ask the registry
        id: check
        # Exit status 0: still needed, or no override left to check. 2: it can be dropped. Anything
        # else is a failure of the check.
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/undici-override"
          pnpm --silent run check:undici-override --strict | tee "$RUNNER_TEMP/undici-override/check.txt"
          status=${PIPESTATUS[0]}
          echo "$status" > "$RUNNER_TEMP/undici-override/status.txt"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then exit "$status"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: undici-override
          path: ${{ runner.temp }}/undici-override/
          if-no-files-found: error
          retention-days: 7

  report:
    name: Open an issue when the override can be dropped
    needs: check
    if: needs.check.outputs.status == '2'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: undici-override
          path: ${{ runner.temp }}/undici-override
      - name: Open an issue unless one is already open
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          result="$RUNNER_TEMP/undici-override"
          if [ "$(cat "$result/status.txt")" != "2" ]; then
            echo "The check's artifact does not say that the override can be dropped." >&2
            exit 1
          fi
          title='Drop the miniflare>undici override'
          open=$(gh issue list --state open --limit 100 --json title --jq "[.[] | select(.title == \"$title\")] | length")
          if [ "$open" != "0" ]; then
            echo "An issue about the override is already open."
            exit 0
          fi
          {
            cat "$result/check.txt"
            echo
            echo 'To drop it:'
            echo
            echo '1. Bump `wrangler` in the root `package.json` to the version named above.'
            echo '2. Delete `miniflare>undici` from `overrides:` in `pnpm-workspace.yaml`.'
            echo '3. Run `pnpm install` and `pnpm audit`; the audit must report no vulnerabilities.'
            echo '4. Run `pnpm test:demo:cloudflare` and `pnpm test:package`.'
            echo '5. In the same PR, delete this weekly check: `.github/workflows/undici-override.yml`, `scripts/check-undici-override.ts`, `test/undici-override.test.ts` and the `check:undici-override` script in the root `package.json`.'
            echo
            echo "Found by $RUN_URL."
          } > "$RUNNER_TEMP/issue.md"
          gh issue create --title "$title" --body-file "$RUNNER_TEMP/issue.md"
