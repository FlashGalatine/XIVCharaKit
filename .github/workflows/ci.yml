name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    env:
      CI: 'true'
      CHARA_LIVE_SMOKE: '0'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.27.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build for type and browser checks
        run: pnpm build
      - run: pnpm type-check
      - run: pnpm lint
      - run: pnpm verify-fixtures
      - run: pnpm verify-palettes
      - run: pnpm test
      - name: Verify demo serving with Cloudflare security headers
        run: pnpm test:demo:cloudflare
      - run: pnpm audit
      - name: Build, pack and verify the final upload artifacts and runtimes
        run: pnpm test:package
      - name: Retain reviewed package and static demo artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chara-artifacts-${{ runner.os }}
          path: |
            .superpowers/package-smoke/*.tgz
            apps/demo/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
